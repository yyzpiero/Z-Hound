[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-scraper"
version = "0.2.0"
description = "CSV-first multi-source indicator-of-compromise collector"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "playwright>=1.46,<2",
  "python-dateutil>=2.9,<3",
  "requests>=2.31,<3",
]

[project.scripts]
ioc-scraper = "ioc_scraper.cli:main"

[project.optional-dependencies]
dashboard = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
]
test = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.setuptools.packages.find]
include = ["ioc_scraper*"]

[tool.setuptools.package-data]
"ioc_scraper" = ["data/*.csv"]
"ioc_scraper.dashboard" = ["static/**"]
