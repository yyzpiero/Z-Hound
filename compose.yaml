services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      IOC_SCRAPER_PROXY: ${IOC_SCRAPER_PROXY:-}
      IOC_SCRAPER_DATA_DIR: /app/data
      FOFA_BASE_URL: ${FOFA_BASE_URL:-https://fofa.info}
      FOFA_EMAIL: ${FOFA_EMAIL:-}
      FOFA_API_KEY: ${FOFA_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    user: "${UID:-1000}:${GID:-1000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    stop_grace_period: 20s
  cli:
    build: .
    profiles: ["cli"]
    entrypoint: ["ioc-scraper"]
    volumes:
      - ./data:/app/data
    environment:
      IOC_SCRAPER_PROXY: ${IOC_SCRAPER_PROXY:-}
      IOC_SCRAPER_DATA_DIR: /app/data
      FOFA_BASE_URL: ${FOFA_BASE_URL:-https://fofa.info}
      FOFA_EMAIL: ${FOFA_EMAIL:-}
      FOFA_API_KEY: ${FOFA_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    user: "${UID:-1000}:${GID:-1000}"
    stdin_open: true
    tty: true
    healthcheck:
      disable: true
