services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      IOC_SCRAPER_PROXY: ${IOC_SCRAPER_PROXY:-}
    user: "${UID:-1000}:${GID:-1000}"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    stop_grace_period: 20s
